<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>יוסי אזולאי · זמר חופות, בר מצוות וטקסים יהודיים בישראל ובעולם</title>
<meta name="description" content="יוסי אזולאי, זמר, יוצר ומפיק מוזיקלי. כניסות לחופה, בר מצוות וטקסים יהודיים בישראל וברחבי העולם, מאז 2004.">
<meta property="og:title" content="יוסי אזולאי · Yossi Azulay">
<meta property="og:description" content="קולה של הנשמה היהודית, ברחבי תבל. חופות, בר מצוות וטקסים יהודיים בישראל ובעולם.">
<meta property="og:image" content="https://yossi-azulay.com/hero-yossi.jpg">
<meta property="og:type" content="website">
<meta name="theme-color" content="#f3ede3">
<link rel="icon" type="image/png" href="logo-mark.png">
<link rel="apple-touch-icon" href="logo-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Frank+Ruhl+Libre:wght@300;400;500&family=Heebo:wght@300;400;500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* VOICE  a luxury house: hushed, precise, generous air; the admin is the same house's back office
   IDEA   a boxed heirloom on ivory card, and the same object spotlit on espresso velvet
   PICTURE a polished-bronze chuppah mark set in a stone arch with soft leaf shadow, and again glowing in a dark spotlight
   COLOUR ivory #f2eee6, espresso #231812, polished bronze/gold metal gradient; admin ivory with espresso and bronze
   TYPE   Cinzel wordmark, Cormorant Garamond / Frank Ruhl Libre display, Jost / Heebo light text
   LAYOUT centred wordmark header; text with arch picture on a laptop, stacked on a phone; ivory and espresso bands alternate */
:root{color-scheme:light dark;
--wine:#231812;--wine2:#2c1f18;--wine3:#4a3426;--gold:#b48a56;--gold2:#e6cc9c;--stone:#f2eee6;--stone2:#e9e2d6;
--metal:linear-gradient(115deg,#6b4423 0%,#a8773f 18%,#e9cf9a 38%,#fff1cf 46%,#c9995a 58%,#8a5c2e 78%,#d7b27a 100%);
--bg:light-dark(#f4f0e8,#17110d);--panel:light-dark(#fffdf9,#211913);--ink:light-dark(#231812,#efe6da);--muted:light-dark(#7a6a5c,#ab9a88);
--line:light-dark(#e4dccf,#3a2d23);--soft:light-dark(#efe9df,#2a2019);--acc:light-dark(#8a5c2e,#d9b27c);--accbg:light-dark(#f3e9da,#3a2b1d);
--ok:light-dark(#2f6b45,#6fcf97);--okbg:light-dark(#e6f1e8,#1b3325);--warn:light-dark(#9a5b12,#f0b458);--warnbg:light-dark(#f8eedd,#3a2b12);--bad:light-dark(#a3301f,#f08a80);--badbg:light-dark(#f9e7e3,#3b1a18)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:300 16.5px/1.65 Jost,Heebo,"Segoe UI",Arial,sans-serif;overflow-x:clip}
b,strong{font-weight:500}
h1,h2,h3,.disp{font-family:"Cormorant Garamond","Frank Ruhl Libre",Georgia,serif;font-weight:400;letter-spacing:-.005em;line-height:1.1;margin:0}
[dir=rtl] h1,[dir=rtl] h2,[dir=rtl] h3,[dir=rtl] .disp{font-weight:300}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
img{max-width:100%}
.scroll{overflow-x:auto}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* demo bar */
#demobar{position:sticky;top:0;z-index:50;display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:8px max(2vw,12px);background:#140e0a;color:#efe6da;border-bottom:1px solid #3a2d23;font-size:14px;font-weight:400}
#demobar b{font-weight:500;margin-inline-end:6px;color:var(--gold2)}
#demobar button{border:1px solid #4a3a2e;background:transparent;color:#efe6da;border-radius:999px;padding:6px 14px;min-height:34px}
#demobar button[aria-pressed=true]{background:var(--metal);border-color:transparent;color:#1d140f;font-weight:500}
#demobar .note{margin-inline-start:auto;opacity:.7;font-size:13px}

/* ---------- PUBLIC SITE ---------- */
.site{background:#f2eee6;color:#231812}
.metal{background:var(--metal);-webkit-background-clip:text;background-clip:text;color:transparent}
.cap{font-family:Jost,Heebo,sans-serif;font-weight:400;font-size:13px;letter-spacing:.32em;text-transform:uppercase}
[dir=rtl] .cap{letter-spacing:.08em;font-size:14px}
.shead{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:16px;padding:22px max(5vw,16px) 14px;max-width:1320px;margin:auto}
.brand{display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;color:#231812}
.brand .lmark{width:auto;height:40px;display:block}
.brand .wm{font-family:Cinzel,"Frank Ruhl Libre",serif;font-size:21px;letter-spacing:.26em;line-height:1;padding-inline-start:.26em;color:#8a5c2e}
.brand .hw{font-family:"Frank Ruhl Libre",serif;font-weight:400;font-size:14px;letter-spacing:.14em;color:#8a5c2e}
.hside{display:flex;gap:16px;align-items:center}
.hside.end{justify-content:flex-end}
.langs{display:flex;gap:2px}
.langs button{border:0;background:none;color:#7a6a5c;padding:6px 7px;font:400 12.5px Jost,sans-serif;letter-spacing:.18em;min-height:32px;border-bottom:1px solid transparent}
.langs button[aria-pressed=true]{color:#231812;border-bottom-color:#b48a56}
.snav{display:flex;justify-content:center;flex-wrap:wrap;gap:6px 34px;padding:12px max(5vw,16px);border-block:1px solid #e1d9cb}
.snav a{text-decoration:none;color:#4a3a2e}
.snav a:hover{color:#8a5c2e}
.lnk{display:inline-flex;align-items:center;gap:14px;text-decoration:none;color:#231812;padding-bottom:10px;border-bottom:1px solid #231812;min-height:44px}
.lnk .ar{font-family:Jost;font-size:22px;line-height:1}
.btn-gold{position:relative;overflow:hidden;background:var(--metal);background-size:200% 100%;color:#1d140f;border:0;padding:15px 30px;min-height:48px;text-decoration:none;display:inline-flex;align-items:center;gap:10px;transition:background-position .8s ease}
.btn-gold:hover{background-position:100% 0}
.btn-ghost{background:transparent;color:inherit;border:1px solid currentColor;padding:14px 28px;min-height:48px;text-decoration:none;display:inline-flex;align-items:center}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(24px,5vw,80px);align-items:center;padding:clamp(28px,5vw,72px) max(5vw,16px);max-width:1320px;margin:auto}
.hero .no{color:#8a7a6a;display:flex;align-items:center;gap:14px}
.hero .no i{display:block;width:56px;height:1px;background:#b48a56}
.hero h1{font-size:clamp(48px,6.4vw,92px);line-height:1;margin:22px 0 22px;color:#231812}
.hero .sub{font-size:clamp(17px,1.5vw,19px);color:#5a4a3e;max-width:40ch;margin:0 0 34px}
.hero .ctas{display:flex;gap:28px;flex-wrap:wrap;align-items:center}
.arch{position:relative;aspect-ratio:4/5;border-radius:999px 999px 0 0;overflow:hidden;background:linear-gradient(180deg,#e9e3d8 0%,#ddd4c6 70%,#cfc4b3 100%);box-shadow:inset 0 0 0 1px #d6ccbc}
.arch svg{position:absolute;inset:0;width:100%;height:100%}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));max-width:1320px;margin:auto;padding:0 max(5vw,16px);border-top:1px solid #e1d9cb}
.facts div{padding:28px 10px;text-align:center}
.facts div+div{border-inline-start:1px solid #e1d9cb}
.facts b{display:block;font-family:"Cormorant Garamond","Frank Ruhl Libre",serif;font-weight:400;font-size:clamp(28px,3vw,38px);line-height:1.1}
.facts span{display:block;margin-top:6px;color:#7a6a5c;font-size:14.5px}
.sband{padding:clamp(56px,8vw,120px) max(5vw,16px)}
.sband.dark{background:radial-gradient(ellipse 60% 55% at 50% 30%,#5a3c29 0%,#33231a 45%,#231812 75%);color:#efe6da}
.sband.ivory2{background:#ebe5da}
.inner{max-width:1240px;margin:auto}
.ital{display:flex;align-items:center;justify-content:center;gap:28px;font-family:"Cormorant Garamond","Frank Ruhl Libre",serif;font-style:italic;font-weight:300;font-size:clamp(30px,3.4vw,44px);margin-bottom:28px}
.ital::before,.ital::after{content:"";width:clamp(48px,9vw,120px);height:1px;background:currentColor;opacity:.45}
.sband h2{font-size:clamp(34px,4.4vw,58px);text-align:center;max-width:20ch;margin:0 auto 18px}
.lead{font-size:18px;max-width:58ch;opacity:.85;margin:0 auto 52px;text-align:center}
.spot{display:grid;place-items:center;margin:-6px auto 36px;width:min(340px,70vw);aspect-ratio:1}
.spot svg{width:100%;height:100%}
.svc{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(18px,3vw,40px)}
.svc article{border-top:1px solid #6a5240;padding-top:22px}
.svc .cap{color:#c9a46c}
.svc h3{font-size:28px;margin:10px 0 10px;color:#f5ecdf}
.svc p{margin:0;color:#c9b9a6;font-size:15.5px}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(18px,3vw,40px);padding:0;margin:0;list-style:none}
.steps li{border-top:1px solid #cdbfa9;padding-top:22px}
.steps .cap{color:#8a7a6a}
.steps b{display:block;font-family:"Cormorant Garamond","Frank Ruhl Libre",serif;font-weight:400;font-size:28px;margin:10px 0 8px}
.steps span{color:#5a4a3e;font-size:15.5px}
.vids{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.vid{text-decoration:none;color:#efe6da;display:block}
.vid .th{aspect-ratio:4/5;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 40%,#4a3426,#1d140f 75%);border:1px solid #4a3a2e}
.vid .th i{width:58px;height:58px;border-radius:50%;border:1px solid #c9a46c;display:grid;place-items:center;font-style:normal;color:#e6cc9c;font-size:16px;padding-inline-start:3px}
.vid p{margin:14px 0 0;font-family:"Cormorant Garamond","Frank Ruhl Libre",serif;font-size:21px;line-height:1.25}
.vidmore{text-align:center;margin-top:44px}
.about{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:clamp(30px,6vw,90px);align-items:center}
.about .arch{display:grid;place-items:center;text-align:center;color:#7a6a5c;padding:40px;font-size:15px}
.about h2{text-align:start;margin:14px 0 22px}
.about p{font-size:17.5px;color:#4a3a2e;margin:0 0 16px;max-width:60ch}
.intake{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:clamp(30px,6vw,90px)}
.intake h2{text-align:start;margin:14px 0 18px}
.intake .lead{text-align:start;margin:0 0 30px}
.chan{display:grid;gap:0;border-top:1px solid #cdbfa9}
.chan a,.chan div{display:flex;gap:14px;align-items:center;padding:16px 0;border-bottom:1px solid #cdbfa9;text-decoration:none;color:#231812}
.chan svg{width:24px;height:24px;flex:none}
form.f{display:grid;gap:22px;color:#231812}
.f label{display:grid;gap:6px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#7a6a5c;font-weight:400}
[dir=rtl] .f label{letter-spacing:.04em;font-size:14px}
.f label small{text-transform:none;letter-spacing:0;color:#9a8a7a;font-size:13.5px}
.f input,.f textarea{border:0;border-bottom:1px solid #b8a990;border-radius:0;padding:10px 0;background:transparent;font:300 18px Jost,Heebo,sans-serif;color:#231812;min-height:46px;letter-spacing:0;text-transform:none}
.f input:focus,.f textarea:focus{outline:0;border-bottom-color:#8a5c2e}
.f textarea{min-height:80px;resize:vertical}
.f .two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px}
.f legend{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#7a6a5c;margin-bottom:10px}
[dir=rtl] .f legend{letter-spacing:.04em;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{display:inline-flex;align-items:center;gap:8px;border:1px solid #cdbfa9;padding:9px 16px;cursor:pointer;color:#231812;text-transform:none;letter-spacing:0;font-size:15px}
.chips label:has(input:checked){border-color:#231812;background:#231812;color:#f2eee6}
.chips input{position:absolute;opacity:0;width:1px;height:1px}
.req{color:#8a5c2e}
.okbox .btn-gold{display:inline-flex;align-items:center;gap:10px}.okbox .btn-gold svg{width:20px;height:20px;flex:none}
.okbox{border:1px solid #cdbfa9;padding:clamp(24px,4vw,44px);color:#231812;text-align:center;display:grid;gap:10px;justify-items:center}
.okbox h3{font-size:40px}
.sfoot{background:#1a120d;color:#b9a896;padding:56px max(5vw,16px) 40px;font-size:15px}
.sfoot .inner{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:30px;align-items:start}
.sfoot .brand{color:#efe6da;align-items:flex-start}
.sfoot .brand .hw{color:#9a8a7a}
.sfoot a{text-decoration:none}
.sfoot a:hover{color:#e6cc9c}
.sfoot .legal{grid-column:1/-1;border-top:1px solid #3a2d23;padding-top:18px;font-size:13px;color:#8a7a6a}
.wafab{position:fixed;inset-inline-end:18px;bottom:18px;z-index:40;width:56px;height:56px;border-radius:50%;background:#231812;display:grid;place-items:center;box-shadow:0 8px 24px rgba(35,24,18,.35);border:1px solid #b48a56}
.wafab svg{width:26px;height:26px}
.demo-line{font-size:13px;opacity:.7;margin-top:12px}
@keyframes tw{0%,100%{opacity:.35}50%{opacity:1}}
.tw{animation:tw 4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.tw{animation:none}.btn-gold{transition:none}}

/* multi-page site */
.hnav{display:flex;gap:28px;font-size:12px}
.hnav a{text-decoration:none;color:#4a3a2e;padding-bottom:3px;border-bottom:1px solid transparent}
.hnav a[aria-current=true]{color:#231812;border-bottom-color:#b48a56}
.hcta{padding:11px 18px;min-height:40px;font-size:11.5px}
.shead{padding-block:16px 14px;border-bottom:1px solid #e1d9cb;max-width:none}
.brand .lmark{height:36px}
.brand .wm{font-size:19px}
.page h2{font-size:clamp(32px,3.6vw,50px);max-width:20ch;margin:0 0 14px}
.page .lead{font-size:17.5px;max-width:56ch;opacity:.85;margin:0 0 28px}
.page.dark .ital,.page .ital{font-size:clamp(28px,3vw,40px)}
.snav{display:none}
@media (max-width:1100px){.hnav{display:none}.snav{display:flex}.hcta{display:none}}
@media (max-width:700px){.site .shead{grid-template-columns:minmax(0,1fr);justify-items:center;gap:10px}.shead .hside.hnav{display:none}.shead .hside.end{justify-content:center}.brand .wm{white-space:nowrap;font-size:17px;letter-spacing:.2em}}

.site{min-height:calc(100svh - 54px);display:flex;flex-direction:column}
.pwrap{flex:1;display:flex;flex-direction:column;animation:fadein .6s ease}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.page{flex:1;width:100%;padding:clamp(24px,4vh,56px) max(5vw,16px);display:flex;align-items:center}
.page>.inner{width:100%}
.page.dark{background:radial-gradient(ellipse 60% 70% at 30% 40%,#5a3c29 0%,#33231a 45%,#231812 78%);color:#efe6da}
.page.ivory2{background:#ebe5da}
.page.hero{display:grid;max-width:1320px;margin:auto}
.hero .arch{height:min(58svh,560px);width:auto;aspect-ratio:4/5;justify-self:center}
.hero .facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:clamp(28px,5vh,56px);border-top:1px solid #e1d9cb;padding:0;max-width:none}
.hero .facts div{padding:18px 10px 0;text-align:start}
.hero .facts div:first-child{padding-inline-start:0}
.hero .facts b{font-size:clamp(22px,2.2vw,28px)}
.hero .facts span{font-size:13.5px}
.snav{gap:6px 40px}
.snav a[aria-current=true]{color:#231812;border-bottom:1px solid #b48a56}
.snav a{padding-bottom:3px}
.cergrid{display:grid;grid-template-columns:minmax(0,.7fr) minmax(0,1.3fr);gap:clamp(24px,5vw,70px);align-items:center}
.cergrid h2{text-align:start;margin:12px 0 10px;max-width:none}
.page.dark .no{color:#c9a46c;display:flex;gap:14px;align-items:center}
.page.dark .no i{display:block;width:56px;height:1px;background:#b48a56}
.cergrid .lead{text-align:start;margin:0 0 22px}
.cergrid .spot{margin:0;width:100%}
.cergrid .svc{grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 36px}
.cergrid .svc h3{font-size:25px;margin:6px 0}
.pfoot{display:flex;align-items:center;gap:22px;flex-wrap:wrap;margin-top:clamp(24px,4vh,44px);padding-top:20px;border-top:1px solid #4a3a2e}
.pfoot .cap{color:#c9a46c}
.pfoot .btn-gold{color:#1d140f}
.howline{display:flex;flex-wrap:wrap;gap:6px 0;list-style:none;margin:0;padding:0;flex:1;color:#d8c8b4}
.howline li+li::before{content:"·";margin:0 14px;color:#8a6a4a}
.page .ital{margin-bottom:clamp(18px,3vh,32px)}
.page .vids .th{aspect-ratio:4/5;max-height:42svh;width:100%}
.page .vidmore{margin-top:clamp(18px,3vh,32px)}
.page .about .arch{height:min(60svh,560px);width:auto;aspect-ratio:4/5;justify-self:center}
.page .about .no,.page .intake .no{color:#8a7a6a;display:flex;gap:14px;align-items:center}
.page .about .no i,.page .intake .no i{display:block;width:56px;height:1px;background:#b48a56}
.fsteps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;list-style:none;margin:0 0 6px;padding:0}
.fsteps li{border-top:2px solid #d6ccbc;padding-top:10px;color:#9a8a7a;font-size:15px}
.fsteps li .cap{display:block;font-size:11.5px;margin-bottom:2px}
.fsteps li.on{border-color:#231812;color:#231812}
.fsteps li.done{border-color:#b48a56;color:#8a5c2e}
.sfoot{display:flex;flex-wrap:wrap;gap:8px 28px;justify-content:space-between;align-items:center;padding:14px max(5vw,16px);font-size:13px;background:#1a120d;color:#a8988a}
.sfoot a{text-decoration:none}.sfoot a:hover{color:#e6cc9c}
.sfoot .cap{font-size:11.5px}
@media (max-width:1000px){.cergrid{grid-template-columns:minmax(0,1fr)}.cergrid .spot{width:min(220px,50vw);justify-self:center}}
@media (max-width:760px){.page{align-items:flex-start}.hero .arch,.page .about .arch{height:auto;width:100%;max-width:360px}.hero .facts div{text-align:center;padding-inline:4px}.hero .facts{grid-template-columns:repeat(3,minmax(0,1fr))!important}.hero .facts div+div{border-top:0!important;border-inline-start:1px solid #e1d9cb!important}.fsteps li{font-size:13px}}
@media (max-width:560px){.page .vids{grid-template-columns:repeat(2,minmax(0,1fr))}.cergrid .svc{grid-template-columns:minmax(0,1fr)}.snav{gap:4px 16px}.hero .facts b{font-size:19px}.hero .facts span{font-size:12px}}
@media (prefers-reduced-motion:reduce){.pwrap{animation:none}}

/* home v3 */
.site .shead{width:100%;margin:0;direction:ltr;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);position:relative}
.hlangs{position:absolute;left:max(5vw,16px);top:50%;transform:translateY(-50%);z-index:2}
.site .shead .brand{grid-column:2}
.site .shead .hnav{grid-column:3}
.shead .hnav{justify-self:end}
.hero .tagline{font-family:"Cormorant Garamond","Frank Ruhl Libre",Georgia,serif;font-weight:300;font-size:clamp(40px,4.2vw,64px);line-height:1.02;margin:0 0 22px;letter-spacing:-.01em}
.hero .htext .sub{max-width:46ch;font-size:clamp(17px,1.35vw,19px);line-height:1.75;margin:0 0 4px}
.hero .htext .facts{grid-template-columns:repeat(2,minmax(0,1fr));margin:clamp(22px,4vh,40px) 0 clamp(18px,3vh,30px)}
.hero .htext .facts div{text-align:start}
.window{position:relative;justify-self:center;height:min(56svh,540px);aspect-ratio:4/5.3;display:flex;flex-direction:column;margin:0}

function totals(qt,lang='he'){
 const lines=[];const b=BASES.find(x=>x.id===qt.base);
 lines.push({n:L(b,lang),a:qt.basePrice});
 for(const a of ADDONS){const it=qt.items[a.id];if(it&&it.on)lines.push({n:L(a,lang)+(it.qty>1?` ×${it.qty}`:''),a:it.price*it.qty})}
 if(qt.sound==='paid'&&qt.soundPrice>0)lines.push({n:L(SOUND,lang),a:qt.soundPrice});
 if(qt.discount>0)lines.push({n:({he:'הנחה',en:'Discount',fr:'Remise',es:'Descuento'})[lang],a:-qt.discount});
 const sub=lines.reduce((s,l)=>s+l.a,0);
 const vat=(!qt.abroad&&qt.cur==='ILS')?Math.round(sub*0.18):0;
 const total=sub+vat;
 const dep=Math.round(total*qt.depositPct/100);
 return {lines,sub,vat,total,dep,bal:total-dep,flights:qt.abroad&&qt.exp.flights?qt.flights:0};
}

const BIO={
he:[
 ['ירושלים',['נולד בירושלים להורים יוצאי מרוקו, גדל בגבעת זאב והחל את דרכו המוזיקלית כנגן קלידים בגיל 7.','את כישרון השירה שלו גילה במקרה, כשהתבקש להחליף זמר בטקס בבית הספר, ועשה את צעדיו הראשונים כזמר בלהקת הנוער ״מעורב ירושלמי״.']],
 ['1996',['בשנת 1996 התגייס לצבא ושירת בלהקה צבאית, שם הכיר את אשתו טלי ואת המפיק המוזיקלי רן אביב, המלווה אותו לאורך כל הקריירה המוזיקלית שלו. מיד עם שחרורו מהשירות החל את דרכו כזמר, והתפרסם עם הדואט המיתולוגי ״אמא״, אותו כתב ושר יחד עם שלומי שבת באלבום ״שלומי שבת וחברים״.']],
 ['2002',['בשנת 2002 שחרר את אלבומו הראשון, ״יוסי אזולאי״, בחברת התקליטים ״הד ארצי״ ובניהולו האישי של משה דץ. האלבום כלל את הלהיטים ״אני אקטוף לך את הירח״, ״בוכה בלילות״ ו״אל האור״, ואת הדואט הייחודי ״לאורך הים״ עם הזמרת עפרה חזה ז״ל, שזיהתה את כישרונו באולפן בו עבדו השניים ופירגנה לעשייתו. יוסי כתב והלחין לאלבום והיה שותף להפקה המוזיקלית יחד עם נדב ביטון ורן אביב. בנוסף כתבו שירים לאלבום שמעון בוסקילה, חמוטל בן זאב ויואב גינאי. האלבום סימן את יוסי כזמר וכיוצר מבטיח בתעשיית המוזיקה בארץ.']],
 ['2004',['בשנת 2004 שחרר את אלבומו השני, ״יום אחד איתך״. האלבום כלל את הלהיט ״פס ליום אחד״, שהפך באותה שנה לאחד הקליפים המשודרים ביותר בערוץ המוזיקה, ואת הדואט ״הכוח באהבתך״ בו הוא מארח את הזמר יואב יצחק. כבר אז גילה יוסי סקרנות רבה לשירים מיתולוגיים, כשבחר להקליט את השאנסון ״אהבה בת 20״ (La Chanson des Vieux Amants). האלבום הגיע למעמד של אלבום זהב, עם מכירות של למעלה מ-20,000 עותקים, וגם בו היה יוסי שותף לכתיבה, להלחנה ולהפקה המוזיקלית.','באותה שנה הוזמן על ידי חברתו, המשוררת חמוטל בן זאב, לשיר בחופת ביתה את ״שיר המעלות״. ההופעה, שעוררה התרגשות עמוקה בקהל, הפכה לרגע מכונן בעשייה המוזיקלית שלו, זימנה לו אירועי חופה רבים והתוותה מחדש את דרכו כזמר חופות ייחודי, ראשון מסוגו בארץ ובעולם.']],
 ['2007–2008',['בשנת 2007 הוחתם בחברת ״תטה״, ובמסגרת המסע המוזיקלי שלו אל המקורות החל להפיק עיבודים חדשים לתפילות, שהותאמו במיוחד לחופות והעניקו להן ממד חדש וממלכתי.','בשנת 2008, לאור ההד הגדול והביקוש מצד הקהל, הוקלטו המזמורים ויצאו כאלבום הקונספט ״תפילות״, אלבומו השלישי. האלבום הפך במהירות להצלחה אדירה ומכר למעלה מ-60,000 עותקים מקוריים (פלטינה כפולה). ״תפילות״ הפך לנכס צאן ברזל בבתים רבים בישראל, ומצא במהירות את דרכו גם אל יהדות התפוצות. האלבום כולל את ״שיר המעלות״, ״אנא בכח״, ״צור משלו אכלנו״ (דואט שלישי עם שלומי שבת), ״אל אדון״ ותפילות רבות נוספות, והפך את יוסי לקולה של הנשמה היהודית ברחבי תבל.']],
 ['2010',['בשנת 2010 יצא אלבום ההמשך, הרביעי במספר, ״תפילות כרך ב׳״, ובו שירי תפילה נוספים שהפכו מזוהים עם ביצועיו של יוסי: ״והיא שעמדה״, ״אם אשכחך ירושלים״, ״שלום עליכם״, ״בואי כלה״ ו״תפילת הדרך״, שכתבה והלחינה עבורו קרן פלס. גם ״תפילות כרך ב׳״ זכה להצלחה אדירה ונמכר בעשרות אלפי עותקים בארץ ובעולם (זהב ופלטינה).','במקביל המשיך יוסי לבסס את מעמדו כזמר וכיוצר מוערך, המופיע במאות אירועים ברחבי הארץ ומוזמן כאמן אורח לאירועי קהילות יהודיות בכל העולם. באותה שנה הקים יחד עם חברו, הזמר טל ועקנין, את מקהלת הילדים Music Kids, המלווה את השניים בהופעותיהם באירועים ובחופות בארץ ובעולם וזוכה לאהדה רבה.']],
 ['2014',['בשנת 2014 יצא אלבום הקונספט ״רטרומנטיקה״, החמישי במספר: אלבום מחווה לקלאסיקות הגדולות של המוזיקה הבינלאומית, עם ביצועים בשש שפות (צרפתית, ספרדית, איטלקית, אנגלית, עברית וערבית), תוך שמירה על הייחוד המוזיקלי המזוהה עמו. האלבום זכה לחיבוק מהקהל בעולם ותורגם למופע ייחודי בליווי 15 נגנים. בין השירים: Besame Mucho, Parla Più Piano, Sway ו-La Chanson des Vieux Amants.','באותן שנים שחרר גם סינגלים מקוריים, ביניהם ״אף פעם לא אומר״ (דואט שני עם שלומי שבת) ו״בזכותך״, וקליפ מצליח במיוחד בהשראת מופעי החופה: ביצוע אופראי ל-״Time to Say Goodbye״ על מילות הפיוט ״בואי בשלום״, שזכה ליותר ממיליון וחצי צפיות ביוטיוב והביא את יוסי להצלחה בינלאומית רחבה בטקסי חופה בעולם כולו. לצד עשייתו המוזיקלית שידר תוכנית יומית ברדיו ״גלי ישראל״ והשתתף כמתמודד מוערך במיוחד בעונה השנייה של ״מאסטר שף״.']],
 ['2017',['אלבומו השישי, ״אנדלוס״, הוא אלבום תפילות על טהרת המוזיקה האנדלוסית, שהפכה לפסקול חייהם של יהודי צפון אפריקה (מרוקו, אלג׳יריה ותוניסיה). כמו קודמיו, הוא מאופיין בהפקה מוזיקלית עשירה ומרהיבה, וכולל דואט עם גדול זמרי צרפת, אנריקו מסיאס, ושיתופי פעולה עם התזמורת האנדלוסית ירושלים, מקהלת הילדים Music Kids והזמר טל ועקנין. שירים מקוריים לאלבום כתבו גם קובי אפללו ואוהד חיטמן. בין השירים: ״אליך אקרא יה״, ״כי אשמרה שבת״ ו״לכה דודי״ (שניהם עם אנריקו מסיאס), ״יעלה יעלה״ (בליווי התזמורת האנדלוסית) ו״אעופה אשכונה״.']],
 ['2023', ['בשנת 2023 יצא אלבומו השביעי, ״תפילות כרך ד׳״, בהפקה מוזיקלית של יוסי ורן אביב, ובו בין השאר ״תפילה״, ״ממעמקים״ וביצוע ל-״The Prayer״.', 'לצד האלבומים שחרר סינגלים נוספים, ביניהם ״טי פאריפאטי (יא נאס, יא נאס)״, וגרסה ל-״Les Yeux de la Mama״.']],
 ['היום', ['בשנים האחרונות יצאו שני סינגלים חדשים: ״אוחילה״, ו״אני מאמין״ – שיתוף פעולה של כמה זמרים יחד, שיר על אחדות, שמזכיר שמה שמחבר בינינו חזק ממה שמפריד.', 'בשנים האחרונות הוא מחלק את זמנו בין הופעות בארץ לבין הופעות בקהילות יהודיות ברחבי העולם: צרפת, פנמה, מקסיקו, ארה״ב, ברזיל, פרו, איטליה, שווייץ, ספרד, אנגליה, רוסיה, קולומביה, יוון, האיים הקריביים ועוד.', 'הסדרה ״זמר חתונות״ הקדישה לו פרק שלם, שבו נחשף כאחד מזמרי החתונות העסוקים בישראל: זוגות סוגרים אותו שנה מראש, ויש ערבים עם שתי הופעות. כיום הוא עובד על אלבום חדש.']]],
en:[
 ['Jerusalem',['Born in Jerusalem to parents from Morocco, Yossi grew up in Givat Ze’ev and began his musical path as a keyboard player at the age of seven.','He discovered his singing talent by chance, when he was asked to replace a singer at a school ceremony, and took his first steps as a singer in the youth ensemble “Meorav Yerushalmi”.']],
 ['1996',['In 1996 he was drafted into the IDF and served in a military entertainment troupe, where he met his wife, Tali, and the music producer Ran Aviv, who has accompanied him throughout his career. Straight after his service he began his singing career, gaining fame with the legendary duet “Ima” (Mother), which he wrote and sang with Shlomi Shabat for the album “Shlomi Shabat and Friends”.']],
 ['2002',['In 2002 he released his first album, “Yossi Azulay”, with the Hed Arzi label and under the personal management of Moshe Datz. The album included the hits “Ani Ektof Lach Et HaYareach”, “Bocha BaLeilot” and “El HaOr”, and the unique duet “LeOrech HaYam” with the late Ofra Haza, who recognised his talent in the studio they shared and supported his work. Yossi wrote and composed for the album and co-produced it with Nadav Biton and Ran Aviv; Shimon Buskila, Hamutal Ben Zeev and Yoav Ginai also wrote songs for it. The album marked Yossi as a promising singer and songwriter in Israel’s music industry.']],
 ['2004',['In 2004 he released his second album, “Yom Echad Itcha” (One Day with You). It included the hit “Pass LeYom Echad”, one of the most broadcast music videos on the Music Channel that year, and the duet “HaKoach BeAhavatech” with the singer Yoav Itzhak. Already then Yossi showed a deep curiosity for legendary songs, recording the chanson “La Chanson des Vieux Amants”. The album went gold, selling more than 20,000 copies, and here too Yossi took part in the writing, composing and production.','That same year his friend, the poet Hamutal Ben Zeev, invited him to sing “Shir HaMaalot” at her daughter’s chuppah. The performance moved the audience deeply and became a turning point in his musical work: it brought him many wedding ceremonies and set him on a new path as a unique chuppah singer, the first of his kind in Israel and the world.']],
 ['2007–2008',['In 2007 he signed with the Teta label and, as part of his musical journey back to his roots, began producing new arrangements of the prayers, adapted especially for the chuppah and giving them a new, majestic dimension.','In 2008, following the great response and demand from the public, these hymns were recorded and released as the concept album “Tfilot” (Prayers), his third album. It quickly became a huge success, selling more than 60,000 original copies (double platinum). “Tfilot” became a treasured part of many Israeli homes and quickly found its way to Jewish communities abroad. The album includes “Shir HaMaalot”, “Ana BeKoach”, “Tzur Mishelo Achalnu” (a third duet with Shlomi Shabat), “El Adon” and many more prayers, and made Yossi the voice of the Jewish soul around the world.']],
 ['2010',['In 2010 the sequel, his fourth album, “Tfilot Vol. 2”, was released, with more prayers that became identified with Yossi’s performances: “VeHi SheAmda”, “Im Eshkachech Yerushalayim”, “Shalom Aleichem”, “Boi Kala” and “Tefilat HaDerech”, written and composed for him by Keren Peles. “Tfilot Vol. 2” was also a great success, selling tens of thousands of copies in Israel and abroad (gold and platinum).','At the same time Yossi continued to establish himself as an acclaimed singer and songwriter, performing at hundreds of events and invited as a guest artist by Jewish communities around the world. That year he and his friend, the singer Tal Vaknin, founded the children’s choir Music Kids, which accompanies them at events and chuppahs in Israel and abroad.']],
 ['2014',['In 2014 he released his fifth album, the concept album “Retromantica”: a tribute to the great classics of international music, performed in six languages (French, Spanish, Italian, English, Hebrew and Arabic) while keeping his distinctive musical signature. The album was embraced by audiences worldwide and became a unique show with 15 musicians. Its songs include Besame Mucho, Parla Più Piano, Sway and La Chanson des Vieux Amants.','In those years he also released original singles, among them “Af Paam Lo Omer” (a second duet with Shlomi Shabat) and “Bizchutech”, and a particularly successful video inspired by his chuppah performances: an operatic “Time to Say Goodbye” set to the piyut “Boi BeShalom”, which passed 1.5 million views on YouTube and brought Yossi wide international success at wedding ceremonies around the world. Alongside his music he hosted a daily show on Galei Israel radio and took part, as a much-loved contestant, in the second season of MasterChef Israel.']],
 ['2017',['His sixth album, “Andalus”, is an album of prayers set entirely to Andalusian music, the soundtrack of the lives of North African Jewry (Morocco, Algeria and Tunisia). Like its predecessors, it features a rich and spectacular production, including a duet with the great French singer Enrico Macias and collaborations with the Jerusalem Andalusian Orchestra, the Music Kids choir and the singer Tal Vaknin. Kobi Aflalo and Ohad Hitman also wrote original songs for the album. Its songs include “Elecha Ekra Yah”, “Ki Eshmera Shabbat” and “Lecha Dodi” (both with Enrico Macias), “Yaale Yaale” (with the Andalusian Orchestra) and “Aufa Eshkona”.']],
 ['2023', ['In 2023 he released his seventh album, “Tfilot Vol. 4”, produced by Yossi and Ran Aviv, featuring among others “Tfila”, “MiMaamakim” and a rendition of “The Prayer”.', 'Alongside the albums he released further singles, including “Ti Paripati (Ya Nass)” and a version of “Les Yeux de la Mama”.']],
 ['Today', ['His latest releases are two new singles: “Ochila”, and “Ani Maamin”, a collaboration between several singers – a song about unity, a reminder that what binds us is stronger than what divides us.', 'In recent years he divides his time between performances in Israel and Jewish communities around the world: France, Panama, Mexico, the United States, Brazil, Peru, Italy, Switzerland, Spain, England, Russia, Colombia, Greece, the Caribbean and more.', 'The TV series “Wedding Singer” devoted a full episode to him, revealing one of Israel’s busiest wedding singers: couples book him a year in advance, and some evenings hold two performances. He is currently working on a new album.']]],
fr:[
 ['Jérusalem',['Né à Jérusalem de parents marocains, Yossi a grandi à Givat Zeev et a commencé son parcours musical comme claviériste, à l’âge de sept ans.','Il a découvert son talent de chanteur par hasard, lorsqu’on lui a demandé de remplacer un chanteur lors d’une cérémonie à l’école, et a fait ses premiers pas de chanteur dans la troupe de jeunes « Meorav Yerushalmi ».']],
 ['1996',['En 1996, il rejoint l’armée et sert dans une troupe militaire, où il rencontre sa femme, Tali, et le producteur Ran Aviv, qui l’accompagne depuis tout au long de sa carrière. Dès la fin de son service, il entame sa carrière de chanteur et se fait connaître avec le duo légendaire « Ima » (Maman), qu’il a écrit et chanté avec Shlomi Shabat pour l’album « Shlomi Shabat et ses amis ».']],
 ['2002',['En 2002, il sort son premier album, « Yossi Azulay », chez Hed Arzi, sous la direction personnelle de Moshe Datz. L’album comprend les succès « Je te cueillerai la lune », « Je pleure la nuit » et « Vers la lumière », ainsi qu’un duo unique, « Le long de la mer », avec la regrettée Ofra Haza, qui avait reconnu son talent dans le studio qu’ils partageaient et l’a soutenu. Yossi a écrit et composé pour l’album et l’a coproduit avec Nadav Biton et Ran Aviv ; Shimon Buskila, Hamutal Ben Zeev et Yoav Ginai y ont également signé des chansons. Cet album l’a imposé comme un chanteur et auteur-compositeur prometteur en Israël.']],
 ['2004',['En 2004 sort son deuxième album, « Un jour avec toi ». On y trouve le succès « Pass pour un jour », l’un des clips les plus diffusés sur la chaîne musicale cette année-là, et le duo « La force de ton amour » avec le chanteur Yoav Itzhak. Déjà, Yossi montre une grande curiosité pour les chansons de légende en enregistrant « La Chanson des Vieux Amants ». L’album est disque d’or, avec plus de 20 000 exemplaires vendus, et Yossi y participe de nouveau à l’écriture, à la composition et à la production.','La même année, son amie la poétesse Hamutal Ben Zeev l’invite à chanter « Shir HaMaalot » sous la houppa de sa fille. Cette prestation, qui bouleverse l’assistance, devient un tournant dans son parcours : elle lui ouvre les portes de nombreuses cérémonies et fait de lui un chanteur de houppa unique, le premier de son genre en Israël et dans le monde.']],
 ['2007–2008',['En 2007, il signe chez Teta et, dans le cadre de son voyage musical vers ses racines, commence à produire de nouveaux arrangements des prières, conçus spécialement pour la houppa et leur donnant une dimension nouvelle et solennelle.','En 2008, face à l’engouement du public, ces chants sont enregistrés et paraissent sous la forme de l’album concept « Tfilot » (Prières), son troisième album. Il connaît un immense succès, avec plus de 60 000 exemplaires originaux vendus (double disque de platine). « Tfilot » devient un trésor dans de nombreux foyers israéliens et gagne rapidement les communautés juives de la diaspora. L’album comprend « Shir HaMaalot », « Ana BeKoach », « Tzur Mishelo Achalnu » (troisième duo avec Shlomi Shabat), « El Adon » et bien d’autres prières, et fait de Yossi la voix de l’âme juive à travers le monde.']],
 ['2010',['En 2010 paraît la suite, son quatrième album, « Tfilot Vol. 2 », avec de nouvelles prières désormais associées à ses interprétations : « VeHi SheAmda », « Im Eshkachech Yerushalayim », « Shalom Aleichem », « Boi Kala » et « Tefilat HaDerech », écrite et composée pour lui par Keren Peles. L’album connaît lui aussi un grand succès, avec des dizaines de milliers d’exemplaires vendus en Israël et à l’étranger (or et platine).','Parallèlement, Yossi s’impose comme un chanteur et auteur reconnu, se produit dans des centaines d’événements et est invité comme artiste par les communautés juives du monde entier. Cette même année, il fonde avec son ami le chanteur Tal Vaknin la chorale d’enfants Music Kids, qui les accompagne lors d’événements et de houppas en Israël et dans le monde.']],
 ['2014',['En 2014 sort son cinquième album, l’album concept « Retromantica » : un hommage aux grands classiques de la musique internationale, interprétés en six langues (français, espagnol, italien, anglais, hébreu et arabe), avec la signature musicale qui lui est propre. Accueilli chaleureusement par le public, l’album est devenu un spectacle unique avec 15 musiciens. On y trouve notamment Besame Mucho, Parla Più Piano, Sway et La Chanson des Vieux Amants.','Ces années-là, il publie aussi des singles originaux, dont « Af Paam Lo Omer » (deuxième duo avec Shlomi Shabat) et « Bizchutech », ainsi qu’un clip particulièrement remarqué, inspiré de ses houppas : une version lyrique de « Time to Say Goodbye » sur les paroles du piyout « Boi BeShalom », vue plus d’un million et demi de fois sur YouTube, qui lui a valu un large succès international lors des cérémonies de mariage. En parallèle, il a animé une émission quotidienne sur la radio Galei Israel et participé, en candidat très apprécié, à la deuxième saison de MasterChef Israël.']],
 ['2017',['Son sixième album, « Andalous », est un album de prières entièrement porté par la musique andalouse, bande-son de la vie des Juifs d’Afrique du Nord (Maroc, Algérie, Tunisie). Comme les précédents, il se distingue par une production riche et somptueuse, avec un duo aux côtés du grand chanteur français Enrico Macias et des collaborations avec l’Orchestre andalou de Jérusalem, la chorale Music Kids et le chanteur Tal Vaknin. Kobi Aflalo et Ohad Hitman ont également écrit des chansons originales pour l’album. On y trouve « Elecha Ekra Yah », « Ki Eshmera Shabbat » et « Lecha Dodi » (tous deux avec Enrico Macias), « Yaale Yaale » (avec l’Orchestre andalou) et « Aufa Eshkona ».']],
 ['2023', ['En 2023 sort son septième album, « Tfilot Vol. 4 », produit par Yossi et Ran Aviv, avec notamment « Tfila », « MiMaamakim » et une interprétation de « The Prayer ».', 'En parallèle, il publie d’autres singles, dont « Ti Paripati (Ya Nass) » et une version de « Les Yeux de la Mama ».']],
 ['Aujourd’hui', ['Ses dernières sorties sont deux nouveaux singles : « Ochila », et « Ani Maamin », une collaboration entre plusieurs chanteurs – une chanson sur l’unité, qui rappelle que ce qui nous unit est plus fort que ce qui nous sépare.', 'Ces dernières années, il partage son temps entre Israël et les communautés juives du monde entier : France, Panama, Mexique, États-Unis, Brésil, Pérou, Italie, Suisse, Espagne, Angleterre, Russie, Colombie, Grèce, les Caraïbes et bien d’autres.', 'La série télévisée « Chanteur de mariage » lui a consacré un épisode entier, montrant l’un des chanteurs de mariage les plus demandés d’Israël : les couples le réservent un an à l’avance, et certains soirs il assure deux prestations. Il travaille actuellement à un nouvel album.']]],
es:[
 ['Jerusalén',['Nacido en Jerusalén en una familia de origen marroquí, Yossi creció en Givat Zeev y comenzó su camino musical como teclista a los siete años.','Descubrió su talento para el canto por casualidad, cuando le pidieron reemplazar a un cantante en una ceremonia escolar, y dio sus primeros pasos como cantante en el grupo juvenil «Meorav Yerushalmi».']],
 ['1996',['En 1996 se incorporó al ejército y sirvió en una banda militar, donde conoció a su esposa, Tali, y al productor musical Ran Aviv, que lo acompaña desde entonces a lo largo de toda su carrera. Al terminar el servicio inició su carrera como cantante y se dio a conocer con el legendario dúo «Ima» (Madre), que escribió y cantó con Shlomi Shabat para el álbum «Shlomi Shabat y amigos».']],
 ['2002',['En 2002 publicó su primer álbum, «Yossi Azulay», con el sello Hed Arzi y bajo la representación personal de Moshe Datz. El disco incluyó los éxitos «Ani Ektof Lach Et HaYareach», «Bocha BaLeilot» y «El HaOr», y el singular dúo «LeOrech HaYam» con la recordada Ofra Haza, que reconoció su talento en el estudio que compartían y apoyó su trabajo. Yossi escribió y compuso para el álbum y lo coprodujo con Nadav Biton y Ran Aviv; Shimon Buskila, Hamutal Ben Zeev y Yoav Ginai también escribieron canciones. El disco lo consagró como un cantante y compositor prometedor en Israel.']],
 ['2004',['En 2004 lanzó su segundo álbum, «Yom Echad Itcha» (Un día contigo), con el éxito «Pass LeYom Echad», uno de los videoclips más emitidos ese año en el Canal de Música, y el dúo «HaKoach BeAhavatech» con el cantante Yoav Itzhak. Ya entonces mostró una gran curiosidad por las canciones legendarias, grabando «La Chanson des Vieux Amants». El álbum fue disco de oro, con más de 20.000 copias vendidas, y también en él Yossi participó en la letra, la composición y la producción.','Ese mismo año, su amiga, la poeta Hamutal Ben Zeev, lo invitó a cantar «Shir HaMaalot» en la jupá de su hija. La actuación conmovió profundamente al público y marcó un punto de inflexión: le abrió las puertas de numerosas ceremonias y lo convirtió en un cantante de jupá único, el primero de su clase en Israel y en el mundo.']],
 ['2007–2008',['En 2007 firmó con el sello Teta y, en su viaje musical hacia las raíces, comenzó a producir nuevos arreglos de los rezos, pensados especialmente para la jupá, que les dieron una dimensión nueva y solemne.','En 2008, ante la gran respuesta del público, esos himnos se grabaron y se publicaron como el álbum conceptual «Tfilot» (Rezos), su tercer disco. Fue un éxito inmediato, con más de 60.000 copias originales vendidas (doble platino). «Tfilot» se convirtió en un tesoro en muchos hogares de Israel y llegó rápidamente a las comunidades judías de la diáspora. Incluye «Shir HaMaalot», «Ana BeKoach», «Tzur Mishelo Achalnu» (tercer dúo con Shlomi Shabat), «El Adon» y muchos otros rezos, y convirtió a Yossi en la voz del alma judía en todo el mundo.']],
 ['2010',['En 2010 se publicó la continuación, su cuarto álbum, «Tfilot Vol. 2», con nuevos rezos que quedaron asociados a sus interpretaciones: «VeHi SheAmda», «Im Eshkachech Yerushalayim», «Shalom Aleichem», «Boi Kala» y «Tefilat HaDerech», escrita y compuesta para él por Keren Peles. También fue un gran éxito, con decenas de miles de copias vendidas en Israel y en el extranjero (oro y platino).','Al mismo tiempo, Yossi se consolidó como un cantante y compositor reconocido, actuando en cientos de eventos e invitado como artista por comunidades judías de todo el mundo. Ese año fundó con su amigo, el cantante Tal Vaknin, el coro infantil Music Kids, que los acompaña en eventos y jupot en Israel y en el mundo.']],
 ['2014',['En 2014 lanzó su quinto álbum, el álbum conceptual «Retromantica»: un homenaje a los grandes clásicos de la música internacional, interpretados en seis idiomas (francés, español, italiano, inglés, hebreo y árabe), con su sello musical inconfundible. El público lo acogió con entusiasmo y se convirtió en un espectáculo único con 15 músicos. Incluye, entre otras, Besame Mucho, Parla Più Piano, Sway y La Chanson des Vieux Amants.','En esos años publicó además sencillos originales, como «Af Paam Lo Omer» (segundo dúo con Shlomi Shabat) y «Bizchutech», y un videoclip de gran éxito inspirado en sus actuaciones en jupot: una versión lírica de «Time to Say Goodbye» con la letra del piyut «Boi BeShalom», que superó el millón y medio de visualizaciones en YouTube y le dio un amplio éxito internacional en ceremonias de boda de todo el mundo. Paralelamente, condujo un programa diario en la radio Galei Israel y participó, como un concursante muy querido, en la segunda temporada de MasterChef Israel.']],
 ['2017',['Su sexto álbum, «Andalus», es un disco de rezos íntegramente basado en la música andalusí, banda sonora de la vida de los judíos del norte de África (Marruecos, Argelia y Túnez). Como sus predecesores, destaca por una producción rica y espectacular, con un dúo junto al gran cantante francés Enrico Macias y colaboraciones con la Orquesta Andalusí de Jerusalén, el coro Music Kids y el cantante Tal Vaknin. Kobi Aflalo y Ohad Hitman también escribieron canciones originales para el disco. Incluye «Elecha Ekra Yah», «Ki Eshmera Shabbat» y «Lecha Dodi» (ambas con Enrico Macias), «Yaale Yaale» (con la Orquesta Andalusí) y «Aufa Eshkona».']],
 ['2023', ['En 2023 publicó su séptimo álbum, «Tfilot Vol. 4», producido por Yossi y Ran Aviv, que incluye, entre otras, «Tfila», «MiMaamakim» y una versión de «The Prayer».', 'Además publicó otros sencillos, como «Ti Paripati (Ya Nass)» y una versión de «Les Yeux de la Mama».']],
 ['Hoy', ['Sus lanzamientos más recientes son dos nuevos sencillos: «Ochila», y «Ani Maamin», una colaboración entre varios cantantes: una canción sobre la unidad, que recuerda que lo que nos une es más fuerte que lo que nos separa.', 'En los últimos años reparte su tiempo entre Israel y las comunidades judías de todo el mundo: Francia, Panamá, México, Estados Unidos, Brasil, Perú, Italia, Suiza, España, Inglaterra, Rusia, Colombia, Grecia, el Caribe y más.', 'La serie de televisión «Cantante de bodas» le dedicó un episodio completo, que mostró a uno de los cantantes de bodas más solicitados de Israel: las parejas lo reservan con un año de antelación y algunas noches tiene dos actuaciones. Actualmente trabaja en un nuevo álbum.']]]
};

  const rows=[['deposit',p.deposit,tt.dep,P2.dep48],['balance',p.balance,tt.bal,p.due_event]];if(e.quote.abroad&&e.quote.flights)rows.push(['flights',p.flights,e.quote.flights,p.due_fl]);
  body=`<div class="grid2"><div class="card"><h2 style="font-size:24px;margin-bottom:10px">${esc(p.pay_t)}</h2><div class="scroll"><table class="qtable"><tbody>${rows.map(r=>`<tr><td><b>${esc(r[1])}</b><br><small class="muted">${esc(r[3])}</small></td><td class="n">${money(r[2],c,lang)}</td><td class="n">${e.pay[r[0]].received?`<span class="tag" style="background:var(--okbg);color:var(--ok)">${esc(p.paid)}</span>`:e.pay[r[0]].ref?`<span class="tag" style="background:var(--accbg);color:var(--acc)">${esc(P2.refWait)}</span>`:`<label class="btn sm" style="cursor:pointer"><input type="file" accept="image/*,application/pdf" data-ref="${r[0]}" style="display:none">${esc(P2.up)}</label>`}</td></tr>`).join('')}</tbody></table></div><p class="card" style="margin:14px 0 0;background:var(--warnbg);border-color:transparent;font-size:15px">${esc(P2.refNote)}</p></div>
  <div class="card"><h3 style="font-size:20px;margin-bottom:8px">${esc(p.bank)}</h3><p style="margin:0 0 4px">יוסי אזולאי · עוסק מורשה ${BIZ_NO}</p><p class="muted" style="margin:0">בנק 00 · סניף 000 · חשבון 000000 <small>(פרטי דמה)</small></p><div class="hr"></div><h3 style="font-size:20px;margin-bottom:8px">${esc(p.card)}</h3><button class="btn pri" type="button" data-act="cardDemo">${esc(p.card)} · ${money(tt.dep,c,lang)}</button><p class="muted" style="font-size:14px">${esc(p.card_n)}</p></div></div>`;
 } else if(S.ptab==='eform'){
  const f=e.eventForm||{};const op=(arr,v)=>arr.map(o=>`<option ${o===v?'selected':''}>${esc(o)}</option>`).join('');
  body=f.ok?`<div class="card"><h2 style="font-size:26px">${esc(P2.eform)}</h2><p class="tag" style="background:var(--okbg);color:var(--ok);font-size:15px;padding:8px 12px;margin-top:10px">✓ ${esc(P2.done)}</p></div>`:
  `<form class="card" id="eform"><h2 style="font-size:26px">${esc(P2.eform)}</h2><p class="muted" style="margin:6px 0 16px">${esc(P2.ef_s)}</p>
  <div class="fields" style="grid-template-columns:repeat(2,minmax(0,1fr))">
   <label>${esc(P2.arrive)}<input class="inp" type="time" name="arrive" value="${esc(f.arrive||'19:30')}"></label>
   <label>${esc(P2.chuppah)}<input class="inp" type="time" name="chuppah" value="${esc(f.chuppah||'20:30')}"></label>
   <label>${esc(P2.guests)}<input class="inp" type="number" name="guests" value="${esc(f.guests||'300')}"></label>
   <label>${esc(P2.hall)}<select name="hall">${op(P2.hallO,f.hall)}</select></label>
   <label>${esc(P2.place)}<select name="place">${op(P2.placeO,f.place)}</select></label>
   <label>${esc(P2.sound)}<select name="sound">${op(P2.soundO,f.sound||(e.soundBy==='us'?P2.soundO[0]:P2.soundO[1]))}</select></label>
   <label class="wide">${esc(P2.soundC)}<input class="inp" name="soundContact" value="${esc(f.soundContact||'')}"></label>
   <label class="wide">${esc(P2.notes)}<textarea name="notes" rows="2">${esc(f.notes||'')}</textarea></label></div>
  <label class="row" style="margin:16px 0;gap:10px;align-items:flex-start"><input type="checkbox" name="ok" required style="width:20px;height:20px;margin-top:3px"><span>${esc(P2.confirm)}</span></label>
  <div class="row"><button class="btn pri" type="submit">${esc(P2.submit)}</button><button class="btn" type="button" data-ptab="songs">${esc(P2.songsLink)}</button></div></form>`;
 } else {
  if(!e.songs)e.songs=(MOMENTS[e.etype]||MOMENTS.other).map(m=>({m,list:[],note:''}));
  body=`<div class="card" style="margin-bottom:14px"><h2 style="font-size:26px">${esc(p.songs_t)}</h2><p class="muted" style="margin:6px 0 0">${esc(p.songs_s)}</p></div>
  <div class="setlist">${e.songs.map((m,i)=>`<div class="moment"><div class="top"><span class="muted" style="min-width:20px">${i+1}</span><input aria-label="${esc(p.add_m)}" data-mname="${i}" value="${esc(L(m.m,lang))}"><button class="ib" type="button" data-act="mUp" data-i="${i}" aria-label="up">↑</button><button class="ib" type="button" data-act="mDown" data-i="${i}" aria-label="down">↓</button><button class="ib" type="button" data-act="mDel" data-i="${i}" aria-label="delete">✕</button></div>
   ${m.list.map((sid,j)=>{const so=SONGS.find(x=>x.id===sid);const name=so?so.t:sid;return `<div class="songchip"><span>♪</span><span class="t">${esc(name)}${so?` <small>${so.len}</small>`:''}</span><button class="ib" type="button" data-act="sDel" data-i="${i}" data-j="${j}" aria-label="remove">✕</button></div>`}).join('')}
   <div class="row"><button class="btn sm" type="button" data-act="pickSong" data-i="${i}">＋ ${esc(p.add_s)}</button><input class="inp" style="flex:1;min-height:36px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel)" placeholder="${esc(p.note)}" data-mnote="${i}" value="${esc(m.note)}"></div></div>`).join('')}</div>
  <div class="card" style="margin-top:12px"><div class="row"><span class="muted">${esc(p.sug)}</span><div class="sugg">${EXTRA_MOMENTS[lang].map((x,k)=>`<button type="button" data-act="mAdd" data-k="${k}">＋ ${esc(x)}</button>`).join('')}<button type="button" data-act="mAdd" data-k="-1">＋ ${esc(p.add_m)}</button></div></div>
  <div class="row" style="margin-top:14px"><button class="btn pri" type="button" data-act="saveSongs">${esc(p.save)}</button>${e.songsFinal?`<span class="tag" style="background:var(--okbg);color:var(--ok)">✓ ${esc(p.saved)}</span>`:''}</div></div>`;
 }
 return `<div class="portal"><div class="phead"><div class="row">
  <div class="sp"><img src="logo-full-dark.png" alt="Yossi Azulay" style="height:64px;width:auto;display:block;margin-bottom:10px"><h1>${esc(p.hello)}, ${esc(e.couple||e.client)}</h1><div class="meta">${esc(L(ETYPES[e.etype],lang))} · ${esc(dfmt(e.date,lang,{weekday:'long',day:'numeric',month:'long',year:'numeric'}))} · ${esc([e.venue,e.city].filter(Boolean).join(', '))}</div></div>
  <label class="muted" style="color:#e3d3bd;font-size:13px">לקוח בהדגמה<br><select id="pev" style="background:#3a1a28;color:#fff;border:1px solid #6a4555;border-radius:8px;padding:6px">${EVENTS.map(x=>`<option value="${x.id}" ${x.id===e.id?'selected':''}>${esc(x.client)}</option>`).join('')}</select></label>
  <div class="langs" role="group" aria-label="Language">${['he','en','fr','es'].map(l=>`<button type="button" data-plang="${l}" aria-pressed="${l===lang}">${({he:'עב',en:'EN',fr:'FR',es:'ES'})[l]}</button>`).join('')}</div></div>
  <div class="ptrack">${tabs.map((k,i)=>`<button type="button" data-ptab="${k}" class="${pdone[k]?'done':''}" aria-current="${S.ptab===k}"><i>${pdone[k]?'✓':i+1}</i>${esc(tabLbl[k])}</button>`).join('')}</div></div>
  <div class="pbody"><div class="card" style="margin-bottom:16px;display:flex;gap:12px;align-items:center;background:var(--accbg);border-color:transparent"><b>${esc(p.next)}</b><span>${esc(p.nexts[nextKey])}</span></div>${body}</div></div>`;
}

/* ================= LIFECYCLE ================= */
const SIDE=[['nurture','לא סגר · מעקב AI','#7d6aa6'],['taken','תאריך תפוס','#8c8278'],['irrelevant','לא רלוונטי','#a69c92']];
for(const s of SIDE)SMAP[s[0]]=s;
const stIdx=e=>STAGES.findIndex(s=>s[0]===e.status);
const isSide=e=>SIDE.some(s=>s[0]===e.status);
const addD=n=>{const t=new Date(TODAY);t.setDate(t.getDate()+n);return t};
const isoOf=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const fdate=(d,lang='he')=>new Intl.DateTimeFormat(LOC[lang],{day:'numeric',month:'long'}).format(d);
const plink=e=>`yossi-azulay.com/p/${e.id}`;

/* message templates, 4 languages */
const TPL={
 formThanks:{t:'אימייל תודה + סרטונים (מיד אחרי הטופס)',
  he:v=>`שלום ${v.n},\nתודה שפניתם אלינו! אנחנו עוברים על הפרטים ובודקים את הזמינות לתאריך ${v.d}, ונחזור אליכם בהקדם.\nבינתיים, כמה רגעים מהחופות של יוסי:\n▶ בלה צ׳או   ▶ עוד ישמע   ▶ אוחילה   ▶ בואי כלה\nנדבר בקרוב,\nיוסי אזולאי`,
  en:v=>`Dear ${v.n},\nThank you for reaching out! We are reviewing your details and checking availability for ${v.d}, and will be back to you shortly.\nIn the meantime, a few moments from Yossi's ceremonies:\n▶ Bella Ciao   ▶ Od Yishama   ▶ Ochila   ▶ Boei Kala\nSpeak soon,\nYossi Azulay`,
  fr:v=>`Bonjour ${v.n},\nMerci de nous avoir contactés ! Nous étudions votre demande et vérifions la disponibilité pour le ${v.d}. Nous revenons vers vous très vite.\nEn attendant, quelques moments des cérémonies de Yossi :\n▶ Bella Ciao   ▶ Od Yishama   ▶ Ochila   ▶ Boei Kala\nÀ très bientôt,\nYossi Azulay`,
  es:v=>`Hola ${v.n}:\n¡Gracias por escribirnos! Estamos revisando sus datos y consultando la disponibilidad para el ${v.d}. Les responderemos muy pronto.\nMientras tanto, algunos momentos de las ceremonias de Yossi:\n▶ Bella Ciao   ▶ Od Yishama   ▶ Ochila   ▶ Boei Kala\nHasta pronto,\nYossi Azulay`},
 quoteCheck:{t:'15 דקות אחרי ההצעה: וידוא שהגיעה',
  he:v=>`היי ${v.n}, שלחנו לכם עכשיו את הצעת המחיר לאירוע ב-${v.d}. רק מוודא שהיא הגיעה ונפתחת כמו שצריך. אם יש שאלות, אני זמין כאן. איתמר`,
  en:v=>`Hi ${v.n}, we have just sent the quote for ${v.d}. Just making sure it arrived and opens properly. If you have any questions, I'm right here. Itamar`,
  fr:v=>`Bonjour ${v.n}, nous venons de vous envoyer le devis pour le ${v.d}. Je vérifie simplement qu'il vous est bien parvenu. Pour toute question, je reste disponible. Itamar`,
  es:v=>`Hola ${v.n}, acabamos de enviarles el presupuesto para el ${v.d}. Solo quería confirmar que les llegó bien. Para cualquier pregunta, estoy aquí. Itamar`},
 fu1:{t:'פולו-אפ ראשון (48 שעות)',
  he:v=>`היי ${v.n}, מה שלומכם? רציתי לבדוק אם הספקתם לעבור על ההצעה. אם תרצו להתאים משהו (הרכב, שירים, הגברה), נשמח לסדר. רק לעדכן שהתאריך ${v.d} שמור עבורכם עד ${v.hold}. נוח לכם שנדבר 5 דקות בטלפון היום או מחר?`,
  en:v=>`Hi ${v.n}, I hope you're well. I wanted to check whether you've had a chance to look at the quote. If you'd like to adjust anything (musicians, songs, sound), we'd be happy to. Just so you know, ${v.d} is held for you until ${v.hold}. Would a quick 5-minute call today or tomorrow work?`,
  fr:v=>`Bonjour ${v.n}, j'espère que vous allez bien. Avez-vous pu consulter le devis ? Si vous souhaitez ajuster quelque chose (musiciens, chants, sonorisation), avec plaisir. Pour information, le ${v.d} vous est réservé jusqu'au ${v.hold}. Un appel de 5 minutes aujourd'hui ou demain vous conviendrait ?`,
  es:v=>`Hola ${v.n}, espero que estén bien. ¿Pudieron revisar el presupuesto? Si quieren ajustar algo (músicos, canciones, sonido), con gusto lo hacemos. Les recuerdo que el ${v.d} está reservado para ustedes hasta el ${v.hold}. ¿Les viene bien una llamada de 5 minutos hoy o mañana?`},
 fu2:{t:'פולו-אפ שני (שבוע, לפני שחרור התאריך)',
  he:v=>`היי ${v.n}, התאריך שלכם (${v.d}) שמור עבורכם עד היום. לפני שנשחרר אותו רציתי לשאול: יש משהו בהצעה שמעכב אתכם? אם זה עניין של תקציב או הרכב, אשמח לבדוק איתכם אפשרות שתתאים. מספיקה תשובה של מילה אחת.`,
  en:v=>`Hi ${v.n}, your date (${v.d}) is held for you until today. Before we release it, may I ask: is anything in the quote holding you back? If it's budget or line-up, I'd be glad to find an option that works. A one-word reply is enough.`,
  fr:v=>`Bonjour ${v.n}, votre date (${v.d}) vous est réservée jusqu'à aujourd'hui. Avant de la libérer, puis-je vous demander si quelque chose vous retient dans le devis ? Si c'est une question de budget ou de formation, je serais ravi de trouver une option adaptée. Un mot suffit.`,
  es:v=>`Hola ${v.n}, su fecha (${v.d}) está reservada hasta hoy. Antes de liberarla, ¿hay algo del presupuesto que les frene? Si es el presupuesto o la formación, con gusto buscamos una opción que les funcione. Basta con una palabra.`},
 deposit:{t:'בקשת מקדמה + אסמכתה (מיד אחרי החתימה)',
  he:v=>`תודה, החוזה נחתם! כדי לשריין סופית את התאריך, נבקש להעביר את המקדמה (${v.dep}) תוך 48 שעות ולהעלות את אסמכתת ההעברה באזור האישי: ${v.l}\nחשוב: מקדמה בלי אסמכתה לא נרשמת אצלנו כמשולמת.`,
  en:v=>`Thank you, the contract is signed! To fully secure your date, please transfer the deposit (${v.dep}) within 48 hours and upload the transfer confirmation on your personal page: ${v.l}\nPlease note: a deposit without a transfer confirmation is not recorded as paid.`,
  fr:v=>`Merci, le contrat est signé ! Pour réserver définitivement votre date, merci de régler l'acompte (${v.dep}) sous 48 heures et de déposer le justificatif de virement dans votre espace personnel : ${v.l}\nImportant : un acompte sans justificatif n'est pas enregistré comme payé.`,
  es:v=>`¡Gracias, el contrato está firmado! Para reservar definitivamente su fecha, transfieran la seña (${v.dep}) en un plazo de 48 horas y suban el comprobante en su área personal: ${v.l}\nImportante: una seña sin comprobante no se registra como pagada.`},
 booked:{t:'התאריך סגור: תודה, קבלה ואסמכתה',
  he:v=>`מזל טוב, התאריך סגור! קיבלנו את המקדמה. האסמכתה והקבלה שמורות באזור האישי שלכם: ${v.l}\nלכל שאלה אנחנו כאן. בינתיים מוזמנים לעקוב אחרינו באינסטגרם ובפייסבוק.`,
  en:v=>`Mazal Tov, your date is booked! We have received the deposit. Your transfer confirmation and receipt are on your personal page: ${v.l}\nWe're here for any question. In the meantime, follow us on Instagram and Facebook.`,
  fr:v=>`Mazal Tov, votre date est réservée ! Nous avons bien reçu l'acompte. Le justificatif et le reçu sont dans votre espace personnel : ${v.l}\nNous restons à votre écoute. Suivez-nous sur Instagram et Facebook.`,
  es:v=>`¡Mazal Tov, su fecha está reservada! Recibimos la seña. El comprobante y el recibo están en su área personal: ${v.l}\nEstamos para cualquier pregunta. Mientras tanto, síganos en Instagram y Facebook.`},
 touch:{t:'שמירת קשר: הזמנה לאזור האישי',
  he:v=>`היי ${v.n}, עוד ${v.left} ימים לאירוע! באזור האישי כבר אפשר להאזין לרפרטואר ולהתחיל לבחור שירים: ${v.l}`,
  en:v=>`Hi ${v.n}, ${v.left} days to go! You can already listen to the repertoire and start choosing songs on your personal page: ${v.l}`,
  fr:v=>`Bonjour ${v.n}, plus que ${v.left} jours ! Vous pouvez déjà écouter le répertoire et commencer à choisir vos chants dans votre espace : ${v.l}`,
  es:v=>`Hola ${v.n}, ¡faltan ${v.left} días! Ya pueden escuchar el repertorio y empezar a elegir canciones en su área personal: ${v.l}`},
 soundCheck:{t:'45 יום לפני: אימות הגברה ובמה (הלקוח סוגר הגברה)',
  he:v=>`היי ${v.n}, לקראת האירוע: האם חברת ההגברה והבמה כבר סגורות? נשמח לקבל שם ומספר של איש הקשר, ונשלח אליהם את המפרט הטכני.`,
  en:v=>`Hi ${v.n}, ahead of the event: are the sound company and stage booked? Please send us the contact's name and number and we'll forward our technical rider.`,
  fr:v=>`Bonjour ${v.n}, en vue de l'événement : la société de sonorisation et la scène sont-elles réservées ? Merci de nous transmettre le nom et le numéro du contact, nous lui enverrons notre fiche technique.`,
  es:v=>`Hola ${v.n}, de cara al evento: ¿ya están contratados el sonido y el escenario? Envíennos el nombre y el número del contacto y le mandaremos nuestro rider técnico.`},
 eventForm:{t:'30 יום לפני: סגירת שירים + טופס אירוע + שיחה',
  he:v=>`היי ${v.n}, חודש לאירוע! הגיע הזמן לסגור את השירים ולמלא את טופס האירוע (שעות, כמות אורחים, מיקום החופה, הגברה): ${v.l}\nנקבע גם שיחה קצרה לעבור על הכול יחד.`,
  en:v=>`Hi ${v.n}, one month to go! It's time to finalise the songs and fill in the event form (times, number of guests, chuppah location, sound): ${v.l}\nWe'll also set a short call to go over everything together.`,
  fr:v=>`Bonjour ${v.n}, plus qu'un mois ! Il est temps de finaliser les chants et de remplir la fiche événement (horaires, nombre d'invités, emplacement de la houppa, sonorisation) : ${v.l}\nNous fixerons aussi un court appel pour tout revoir ensemble.`,
  es:v=>`Hola ${v.n}, ¡falta un mes! Es momento de cerrar las canciones y completar el formulario del evento (horarios, número de invitados, ubicación de la jupá, sonido): ${v.l}\nTambién agendaremos una breve llamada para repasarlo todo.`},
 balance:{t:'14 יום לפני: תזכורת יתרה',
  he:v=>`היי ${v.n}, תזכורת: את יתרת התשלום (${v.bal}) יש להעביר עד 5 ימים לפני האירוע, כלומר עד ${v.due}, ולהעלות את האסמכתה באזור האישי: ${v.l}`,
  en:v=>`Hi ${v.n}, a reminder: the balance (${v.bal}) is due up to 5 days before the event, i.e. by ${v.due}. Please upload the transfer confirmation on your personal page: ${v.l}`,
  fr:v=>`Bonjour ${v.n}, petit rappel : le solde (${v.bal}) est à régler au plus tard 5 jours avant l'événement, soit le ${v.due}. Merci de déposer le justificatif dans votre espace : ${v.l}`,
  es:v=>`Hola ${v.n}, un recordatorio: el saldo (${v.bal}) debe abonarse hasta 5 días antes del evento, es decir, el ${v.due}. Suban el comprobante en su área personal: ${v.l}`},
 balanceLate:{t:'5 ימים לפני: היתרה לא שולמה',
  he:v=>`היי ${v.n}, עדיין לא קיבלנו את יתרת התשלום. לפי ההסכם, בלי תשלום מלא עד 5 ימים לפני האירוע לא נוכל לקיים את ההופעה. נשמח שתעבירו היום ותעלו אסמכתה: ${v.l}`,
  en:v=>`Hi ${v.n}, we have not yet received the balance. Under the agreement, without full payment 5 days before the event we will not be able to perform. Please transfer today and upload the confirmation: ${v.l}`,
  fr:v=>`Bonjour ${v.n}, nous n'avons pas encore reçu le solde. Selon le contrat, sans paiement intégral 5 jours avant l'événement, la prestation ne pourra pas avoir lieu. Merci de régler aujourd'hui et de déposer le justificatif : ${v.l}`,
  es:v=>`Hola ${v.n}, aún no hemos recibido el saldo. Según el contrato, sin el pago completo 5 días antes del evento no podremos actuar. Les pedimos transferir hoy y subir el comprobante: ${v.l}`},
 after:{t:'יום אחרי: תודה + בקשת המלצה',
  he:v=>`${v.n}, תודה שנתתם לנו להיות חלק מהערב שלכם. אם נהניתם, נשמח מאוד להמלצה קצרה, היא עוזרת לנו יותר ממה שנדמה.`,
  en:v=>`${v.n}, thank you for letting us be part of your evening. If you enjoyed it, a short review would mean a great deal to us.`,

/* timeline: every automatic message and every task, dated from the event */
function timeline(e){
 const it=[];const ed=new Date(e.date+'T12:00');const E=n=>{const t=new Date(ed);t.setDate(t.getDate()+n);return t};
 const add=(when,label,kind,key,done,act)=>it.push({when,label,kind,key,done,act});
 const si=stIdx(e),p=e.pay,priv=e.ctype!=='producer';
 add(addD(-(e.ageDays??((e.quoteSentDays??0)+1))),'אימייל תודה + סרטונים ללקוח · התראה אליך על פנייה חדשה','auto','formThanks',true);
 if(e.status==='lead'||e.status==='checking')add(addD(0),'לבדוק זמינות ולחזור ללקוח','task',null,false,'open');
 if(e.quoteSentDays!=null){const s=-e.quoteSentDays;
  add(addD(s),'הצעת מחיר נשלחה במייל + PDF, נשמרה במערכת ובתיקייה','auto',null,true);
  add(addD(s),'15 דקות אחרי: וידוא שההצעה התקבלה','auto','quoteCheck',true);
  add(addD(s+2),'48 שעות: פולו-אפ ראשון (אתה)','task','fu1',!!e.fu1||si>=3||isSide(e),'fu1');
  add(addD(s+7),'שבוע: פולו-אפ שני, ניסיון סגירה (הנחה / נגן מתנה)','task','fu2',!!e.fu2||si>=3||isSide(e),'fu2');
  add(addD(s+7),'שריון התאריך מסתיים','check',null,si>=3||isSide(e));
 }
 if(e.status==='nurture')add(addD(0),'עבר למעקב AI (ניסיוני): רצף הודעות אוטומטי','auto',null,true);
 if(isSide(e)){return it.sort((a,b)=>a.when-b.when)}
 if(e.contract!=='none'){const c=-(e.contractSentDays??0);
  add(addD(c),'חוזה נשלח לחתימה דיגיטלית','auto',null,true);
  add(addD(c+2),'48 שעות: מקדמה + אסמכתה בחשבון','check','deposit',p.deposit.received&&!!p.deposit.ref);}
 if(p.deposit.received){const dd=new Date(p.deposit.date+'T12:00');
  add(dd,'קבלה על המקדמה ב-YAZ','task',null,!!p.deposit.receipt&&p.deposit.receipt!=='pending','receipt-deposit');
  add(dd,'תודה + קבלה + אסמכתה + עקבו אחרינו','auto','booked',true);
  if(e.soundBy==='us')add(dd,'לשריין חברת הגברה (הלקוח שילם על הגברה)','task',null,!!e.soundCompany,'sound');
  const from=Math.max(days(p.deposit.date)+60,1),to=days(e.date)-45;for(let x=from;x<to;x+=60)add(addD(x),'שמירת קשר: הזמנה לאזור האישי ולבחירת שירים','auto','touch',x<=0);
 }
 if(si>=5||e.contract==='signed'){
  if(e.soundBy!=='us')add(E(-45),'45 יום: אימות הגברה ובמה מול הלקוח','task','soundCheck',!!e.soundVerified,'soundV');
  add(E(-30),'30 יום: מוזיקה סגורה + טופס אירוע ללקוח','auto','eventForm',days(e.date)<=30);
  add(E(-28),'שיחת טלפון: מעבר על כל הפרטים','task',null,!!e.call,'call');
  add(E(-14),'14 יום: תזכורת יתרה (יחד עם טופס האירוע)','auto','balance',days(e.date)<=14);
  add(E(-5),'5 ימים: יתרה + אסמכתה בחשבון',p.balance.received?'check':'auto',p.balance.received?null:'balanceLate',p.balance.received);
  add(E(0),'האירוע','event',null,days(e.date)<0);
  add(E(1),'תודה + בקשת המלצה','auto','after',days(e.date)<0);
  add(E(2),'חשבוניות ספקים: לתיקייה + להעלות לרו״ח','task',null,(e.suppliers||[]).every(x=>x.inv&&x.acc),'open');
 }
 return it.sort((a,b)=>a.when-b.when);
}

function aCal(){
 const y=S.calY,m=S.calM;const first=new Date(y,m,1);const start=new Date(y,m,1-first.getDay());
 let cells='';for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const iso=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const evs=EVENTS.filter(e=>e.date===iso);const isT=d.toDateString()===TODAY.toDateString();
  cells+=`<div class="d ${d.getMonth()!==m?'o':''} ${isT?'today':''}"><b>${d.getDate()}</b>${evs.map(e=>`<button type="button" class="ev" data-open="${e.id}" style="background:${stage(e.status)[2]}">${esc(e.client)}</button>`).join('')}</div>`}
 const title=new Intl.DateTimeFormat('he-IL',{month:'long',year:'numeric'}).format(first);
 return `<div class="mhead"><h1>יומן</h1><span class="tag" style="background:var(--okbg);color:var(--ok)">מסונכן עם Google Calendar</span><button class="btn" type="button" data-act="calPrev">→</button><b style="min-width:120px;text-align:center">${title}</b><button class="btn" type="button" data-act="calNext">←</button></div>
 <div class="scroll"><div class="cal" style="min-width:560px">${['א׳','ב׳','ג׳','ד׳','ה׳','ו׳','ש׳'].map(d=>`<div class="h">${d}</div>`).join('')}${cells}</div></div>

}
function aMoney(){
 const rows=[];for(const e of EVENTS){const tt=totals(e.quote);for(const k of ['deposit','balance','flights']){const p=e.pay[k];if(!p.received)continue;rows.push({e,k,p,amt:k==='deposit'?tt.dep:k==='balance'?tt.bal:e.quote.flights})}}
 const list=rows.filter(r=>S.payFilter==='all'||(S.payFilter==='pending'?r.p.receipt==='pending':r.p.receipt&&r.p.receipt!=='pending'));
 const open=EVENTS.filter(e=>e.contract==='signed').flatMap(e=>{const tt=totals(e.quote);return [['deposit',tt.dep],['balance',tt.bal]].filter(([k])=>!e.pay[k].received).map(([k,a])=>({e,k,a}))});
 return `<div class="mhead"><h1>תשלומים וקבלות</h1><div class="radios">${[['pending','קבלה להפקה'],['done','הופקה'],['all','הכול']].map(([v,l])=>`<label><input type="radio" name="pf" value="${v}" ${S.payFilter===v?'checked':''} data-pf> ${l}</label>`).join('')}</div></div>

 </tbody></table></div>
 <p class="muted" style="font-size:14px">לYAZ אין כרגע API, אז ההפקה נשארת ידנית: "העתקת פרטים" מכינה את כל מה שצריך להדביק שם. אם יתחבר API, הכפתור יפיק את הקבלה לבד.</p>`;

/* signature */
function initSig(){const c=$('#sig');if(!c)return;const r=c.getBoundingClientRect();c.width=r.width*devicePixelRatio;c.height=r.height*devicePixelRatio;const x=c.getContext('2d');x.scale(devicePixelRatio,devicePixelRatio);x.lineWidth=2.4;x.lineCap='round';x.strokeStyle='#22161d';let d=false;S.sig=false;
 const pos=ev=>{const b=c.getBoundingClientRect();return [ev.clientX-b.left,ev.clientY-b.top]};
 c.onpointerdown=ev=>{d=true;c.setPointerCapture(ev.pointerId);const [a,b]=pos(ev);x.beginPath();x.moveTo(a,b)};
 c.onpointermove=ev=>{if(!d)return;const [a,b]=pos(ev);x.lineTo(a,b);x.stroke();S.sig=true};
 c.onpointerup=()=>{d=false}}

 if(t.dataset.auto!==undefined){AUTOS[+t.dataset.auto].on=t.checked;toast(t.checked?'האוטומציה הופעלה':'האוטומציה כובתה');return}
 if(t.dataset.pf!==undefined){S.payFilter=t.value;render();return}
 if(t.id==='upl'){toast(`נבחרו ${t.files.length} קבצים. בגרסה האמיתית הם יועלו לספרייה`);return}
 if(!S.ev)return;const ev_=ev(S.ev);
 if(t.dataset.f&&t.tagName==='SELECT'){const k=t.dataset.f;ev_[k]=k==='hotelApproved'?t.value==='1':t.value;if(k==='status'){log(ev_,'סטטוס שונה ל"'+stage(t.value)[1]+'"');toast('הסטטוס עודכן, וגם ביומן גוגל')}render();return}
 if(t.dataset.q==='base'){ev_.quote.base=t.value;ev_.quote.basePrice=BASES.find(b=>b.id===t.value).price;render();return}
 if(t.dataset.q==='cur'){ev_.quote.cur=t.value;render();return}
 if(t.dataset.q==='abroad'){ev_.quote.abroad=t.checked;render();return}
 if(t.dataset.q==='sound'){ev_.quote.sound=t.value;$('#qsum').innerHTML=qsum(ev_);return}
 if(t.dataset.qi&&t.dataset.p==='on'){const it=ev_.quote.items[t.dataset.qi]||(ev_.quote.items[t.dataset.qi]={on:false,qty:1,price:ADDONS.find(a=>a.id===t.dataset.qi).price});it.on=t.checked;$('#qsum').innerHTML=qsum(ev_);return}
 if(t.dataset.qe){ev_.quote.exp[t.dataset.qe]=t.checked;$('#qsum').innerHTML=qsum(ev_);return}
 if(t.dataset.sup!==undefined){ev_.suppliers[+t.dataset.sup].inv=t.checked;render();return}
 if(t.dataset.supacc!==undefined){ev_.suppliers[+t.dataset.supacc].acc=t.checked;render();return}
 if(t.dataset.f==='date'){toast('התאריך עודכן גם ביומן גוגל')}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

fromHash();
}
</script>
</body>
</html>
